name: Update pins

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pins

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Update marketplace.json
        run: bash scripts/update-pins.sh

      - name: Open a pull request
        run: |
          if git diff --quiet; then
            echo "pins are up to date"
            exit 0
          fi
          branch="chore/update-pins"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: update pinned code-guard and code-loops commits"
          git push --force origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" != "0" ]; then
            echo "an open pull request already exists; branch updated"
            exit 0
          fi
          gh pr create \
            --title "chore: update pinned code-guard and code-loops commits" \
            --body "Moves the sha pins in .claude-plugin/marketplace.json to the current HEAD of each repository. Generated by scripts/update-pins.sh."
